<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laravel API klients</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 4) Progress bar lapas augšā -->
    <div id="progress" class="progress" aria-hidden="true"><div class="progress__bar"></div></div>

    <header class="topbar">
        <h1>Laravel API klients</h1>

        <div class="settings">
            <label>
                API adrese
                <input id="api-base" type="url" value="http://localhost:8000/api">
            </label>

            <fieldset class="method-switch">
                <legend>Pieprasījuma metode</legend>
                <label><input type="radio" name="method" value="xhr" checked> XMLHttpRequest</label>
                <label><input type="radio" name="method" value="promise"> fetch + Promises</label>
                <label><input type="radio" name="method" value="async"> fetch + async/await</label>
            </fieldset>

            <label class="inline">
                <input id="slow" type="checkbox"> Lēns tīkls (+1 s)
            </label>
        </div>

        <div id="auth-status" class="auth-status"></div>
    </header>

    <main class="layout">
        <section class="column">
            <!-- Autentifikācija -->
            <section id="auth-panel" class="card">
                <div class="tabs">
                    <button type="button" class="tab active" data-tab="login">Pieteikties</button>
                    <button type="button" class="tab" data-tab="register">Reģistrēties</button>
                </div>

                <form id="login-form" class="form">
                    <input name="email" type="email" placeholder="E-pasts" required>
                    <input name="password" type="password" placeholder="Parole" required>
                    <button type="submit">Pieteikties</button>
                </form>

                <form id="register-form" class="form" hidden>
                    <input name="name" placeholder="Vārds" required>
                    <input name="email" type="email" placeholder="E-pasts" required>
                    <input name="password" type="password" placeholder="Parole" required>
                    <input name="password_confirmation" type="password" placeholder="Parole atkārtoti" required>
                    <button type="submit">Reģistrēties</button>
                </form>
            </section>

            <!-- Ierakstu saraksts -->
            <section class="card">
                <div class="card__head">
                    <h2>Ieraksti</h2>
                    <button id="load-posts" type="button">Ielādēt ierakstus</button>
                </div>

                <form id="post-form" class="form" hidden>
                    <h3 id="post-form-title">Jauns ieraksts</h3>
                    <input type="hidden" name="id">
                    <input name="title" placeholder="Virsraksts" maxlength="255" required>
                    <textarea name="body" rows="3" placeholder="Saturs" required></textarea>
                    <div class="row">
                        <button type="submit">Saglabāt</button>
                        <button id="post-form-cancel" type="button" class="secondary" hidden>Atcelt</button>
                    </div>
                </form>

                <ul id="posts" class="list"></ul>
            </section>
        </section>

        <section class="column">
            <!-- Izvēlētais ieraksts un komentāri -->
            <section id="post-detail" class="card">
                <p class="muted">Izvēlieties ierakstu no saraksta.</p>
            </section>

            <!-- Pieprasījumu žurnāls -->
            <section class="card">
                <div class="card__head">
                    <h2>Pieprasījumu žurnāls</h2>
                    <button id="clear-log" type="button" class="secondary">Notīrīt</button>
                </div>
                <ol id="log" class="log"></ol>
            </section>
        </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>

    <!-- Parasti skripti (nevis moduļi), lai lapa strādā arī atverot to kā failu -->
    <script src="js/api-xhr.js"></script>
    <script src="js/api-fetch-promise.js"></script>
    <script src="js/api-fetch-async.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
